name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --locked
      - run: uv lock --check
      - run: uv run ruff format --check schedulingApp.py tests scripts
      - run: uv run pytest -q
      - run: node --test tests/test_demo.js
      - run: uv run ruff check schedulingApp.py tests scripts
      - run: uv run pip-audit
      - run: uv run python scripts/release_guard.py
      - run: |
          uv build
          uv run python scripts/verify_distribution.py
